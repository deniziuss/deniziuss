<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="121" viewBox="0 0 1000 121" role="img" aria-label="Build thoughtfully, improve continuously"><style>:root{--b:#F7F9FB;--c:#FFFFFF;--t:#152331;--m:#5B6D7D;--l:#C6D2DE;--a:#117EA4;--v:#6C5ACA} @media(prefers-color-scheme:dark){:root{--b:#0D131B;--c:#111D29;--t:#E7EFF6;--m:#9CAFC0;--l:#304152;--a:#47CFEF;--v:#AF9BFA}} .mono{font-family:Consolas,Menlo,monospace}.sans{font-family:Arial,Helvetica,sans-serif}.fade{animation:fade .8s both}@keyframes fade{from{opacity:.45}to{opacity:1}}.dash{stroke-dasharray:7 8;animation:move 10s linear infinite}@keyframes move{to{stroke-dashoffset:-120}}@media(prefers-reduced-motion:reduce){.fade,.dash{animation:none}}</style>
<rect x="2" y="2" width="996" height="117" rx="10" fill="var(--b)" stroke="var(--l)"/>
<text x="43" y="29" class="mono" font-size="11" letter-spacing="2" fill="var(--a)">EOF / KEEP BUILDING</text><line x1="43" y1="41" x2="957" y2="41" stroke="var(--l)"/>
<text x="43" y="80" class="sans" font-size="27" font-weight="bold" fill="var(--t)">Build thoughtfully. Improve continuously.</text>
<text x="43" y="104" class="mono" font-size="11.5" fill="var(--m)">SOFTWARE · SECURITY · NETWORKING · APPLIED AI</text><circle cx="943" cy="83" r="6" fill="var(--a)"/></svg>